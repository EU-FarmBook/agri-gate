services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    environment:
      APP_ENV: development
      APP_PORT: 8900
      APP_VERSION: dev
      DATABASE_URL: postgres://agri_gate:agri_gate@postgres:5432/agri_gate?sslmode=disable
      CLAMD_ADDR: clamav:3310
      MAX_ARCHIVE_DEPTH: 3
      MAX_ARCHIVE_ENTRIES: 2048
      MAX_EXPANDED_BYTES: 209715200
      MAX_REDIRECTS: 5
      HTTP_TIMEOUT_SECONDS: 10
    ports:
      - "8900:8900"
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agri_gate
      POSTGRES_USER: agri_gate
      POSTGRES_PASSWORD: agri_gate
    ports:
      - "8901:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri_gate -d agri_gate"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  clamav:
    image: clamav/clamav:stable
    ports:
      - "8902:3310"

volumes:
  postgres_data:
